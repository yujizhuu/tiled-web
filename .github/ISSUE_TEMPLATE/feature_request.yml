name: ✨ 功能建议 / Feature request
description: 建议新功能或改进 / Suggest a feature or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题 / Problem
      description: 你在做什么时遇到了不便？/ What are you trying to do?
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案 / Proposal
    validations: { required: true }
  - type: textarea
    id: upstream
    attributes:
      label: 官方 Tiled 是否有此功能 / Does desktop Tiled have it?
      description: 有的话请附文档链接或截图 / Link docs or screenshots if so
  - type: checkboxes
    id: help
    attributes:
      label: 参与 / Contribution
      options:
        - label: 我愿意提交 PR / I'd like to send a PR
